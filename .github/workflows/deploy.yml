name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Image SHA to deploy (leave empty to build the current revision)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: su-store-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Frontend lint & tests
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check backend contract
        run: npm run contract:sync -- --check

  image:
    needs: test
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/weerapong-gui/su-store-web:${{ github.sha }}
            ghcr.io/weerapong-gui/su-store-web:main

  deploy:
    needs: [image]
    if: always() && vars.DEPLOY_ENABLED == 'true' && (needs.image.result == 'success' || inputs.sha != '')
    runs-on: [self-hosted, su-store]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check out deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install frontend deployment files
        shell: bash
        run: |
          install -d "${SU_STORE_DIR:?}/frontend"
          cp compose.yml "${SU_STORE_DIR}/frontend/compose.yml"
          if [ ! -x "${SU_STORE_DIR:?}/backend/ops/deploy-service.sh" ]; then
            echo "ต้อง deploy backend ก่อน: ไม่พบ backend/ops/deploy-service.sh" >&2
            exit 1
          fi

      - name: Deploy frontend image
        run: '"${SU_STORE_DIR:?}/backend/ops/deploy-service.sh" frontend "$DEPLOY_SHA"'
